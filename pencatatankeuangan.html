
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Keuangan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #243044;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #697586;
            margin-bottom: 25px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .card, .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .card p {
            margin: 0 0 12px;
            color: #697586;
            font-size: 14px;
        }

        .card h2 {
            margin: 0;
            font-size: 23px;
            overflow-wrap: anywhere;
        }

        .income {
            color: #16834a;
        }

        .expense {
            color: #d63939;
        }

        .balance {
            color: #2457d6;
        }

        .panel {
            margin-bottom: 24px;
        }

        h3 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d7dce3;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #bed0ff;
            border-color: #2457d6;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-primary {
            background: #2457d6;
            color: white;
        }

        .btn-primary:hover {
            background: #1945b3;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px 10px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #edf0f4;
        }

        th {
            background: #f8fafc;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .number {
            text-align: right;
        }

        .empty {
            text-align: center;
            color: #7b8493;
            padding: 25px;
        }

        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Catatan Keuangan</h1>
    <p class="subtitle">
        Catat dan pantau pemasukan, pengeluaran, serta saldo Anda.
    </p>

    <!-- Ringkasan keuangan -->
    <div class="summary">
        <div class="card">
            <p>Total Pemasukan</p>
            <h2 id="totalIncome" class="income">Rp0</h2>
        </div>

        <div class="card">
            <p>Total Pengeluaran</p>
            <h2 id="totalExpense" class="expense">Rp0</h2>
        </div>

        <div class="card">
            <p>Saldo Akhir</p>
            <h2 id="finalBalance" class="balance">Rp0</h2>
        </div>
    </div>

    <!-- Form input transaksi -->
    <div class="panel">
        <h3>Tambah Transaksi</h3>

        <form id="financeForm">
            <div class="form-grid">

                <div>
                    <label for="date">Tanggal</label>
                    <input type="date" id="date" required>
                </div>

                <div>
                    <label for="category">Kategori</label>
                    <input
                        type="text"
                        id="category"
                        placeholder="Contoh: Makanan, Gaji"
                        required
                    >
                </div>

                <div class="full-width">
                    <label for="description">Keterangan</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Contoh: Membeli makan siang"
                        required
                    >
                </div>

                <div>
                    <label for="income">Pemasukan (Rp)</label>
                    <input
                        type="number"
                        id="income"
                        min="0"
                        step="1"
                        placeholder="0"
                    >
                </div>

                <div>
                    <label for="expense">Pengeluaran (Rp)</label>
                    <input
                        type="number"
                        id="expense"
                        min="0"
                        step="1"
                        placeholder="0"
                    >
                </div>

                <div class="full-width">
                    <button type="submit" class="btn-primary">
                        + Simpan Transaksi
                    </button>
                </div>

            </div>
        </form>
    </div>

    <!-- Tabel transaksi -->
    <div class="panel">
        <h3>Riwayat Transaksi</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Kategori</th>
                        <th>Keterangan</th>
                        <th class="number">Pemasukan</th>
                        <th class="number">Pengeluaran</th>
                        <th class="number">Saldo</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="transactionList">
                    <tr>
                        <td colspan="7" class="empty">
                            Belum ada transaksi.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const STORAGE_KEY = "catatanKeuanganData";

    const form = document.getElementById("financeForm");
    const dateInput = document.getElementById("date");
    const categoryInput = document.getElementById("category");
    const descriptionInput = document.getElementById("description");
    const incomeInput = document.getElementById("income");
    const expenseInput = document.getElementById("expense");
    const transactionList = document.getElementById("transactionList");

    // Format angka menjadi Rupiah
    function rupiah(amount) {
        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(amount);
    }

    // Mengambil tanggal hari ini dalam zona waktu lokal
    function todayString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    dateInput.value = todayString();

    // Membaca data yang tersimpan di browser
    function loadTransactions() {
        try {
            const data = JSON.parse(
                localStorage.getItem(STORAGE_KEY) || "[]"
            );

            return Array.isArray(data) ? data : [];
        } catch (error) {
            return [];
        }
    }

    let transactions = loadTransactions();

    // Menyimpan data ke browser
    function saveTransactions() {
        try {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(transactions)
            );
        } catch (error) {
            alert("Data gagal disimpan. Periksa penyimpanan browser.");
        }
    }

    // Urutkan berdasarkan tanggal dari paling lama
    function chronologicalTransactions() {
        return [...transactions].sort((a, b) => {
            const dateCompare = a.date.localeCompare(b.date);

            if (dateCompare !== 0) {
                return dateCompare;
            }

            return a.createdAt - b.createdAt;
        });
    }

    // Mencegah teks pengguna dianggap sebagai HTML
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[character];
        });
    }

    // Menghitung saldo setiap transaksi dan memperbarui tabel
    function renderTransactions() {
        const chronological = chronologicalTransactions();

        let runningBalance = 0;
        let totalIncome = 0;
        let totalExpense = 0;

        const balances = {};

        chronological.forEach(transaction => {
            totalIncome += transaction.income;
            totalExpense += transaction.expense;

            runningBalance += transaction.income;
            runningBalance -= transaction.expense;

            balances[transaction.id] = runningBalance;
        });

        // Perbarui ringkasan
        document.getElementById("totalIncome").textContent =
            rupiah(totalIncome);

        document.getElementById("totalExpense").textContent =
            rupiah(totalExpense);

        const finalBalance = document.getElementById("finalBalance");
        finalBalance.textContent = rupiah(runningBalance);

        finalBalance.className =
            runningBalance < 0 ? "expense" : "balance";

        if (transactions.length === 0) {
            transactionList.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        Belum ada transaksi.
                    </td>
                </tr>
            `;
            return;
        }

        // Tampilkan transaksi terbaru di baris paling atas
        const newestFirst = [...chronological].reverse();

        transactionList.innerHTML = newestFirst.map(transaction => `
            <tr>
                <td>${escapeHTML(transaction.date)}</td>
                <td>${escapeHTML(transaction.category)}</td>
                <td>${escapeHTML(transaction.description)}</td>

                <td class="number income">
                    ${transaction.income > 0
                        ? rupiah(transaction.income)
                        : "—"}
                </td>

                <td class="number expense">
                    ${transaction.expense > 0
                        ? rupiah(transaction.expense)
                        : "—"}
                </td>

                <td class="number">
                    <strong>${rupiah(balances[transaction.id])}</strong>
                </td>

                <td>
                    <button
                        type="button"
                        class="btn-delete"
                        data-id="${escapeHTML(transaction.id)}"
                    >
                        Hapus
                    </button>
                </td>
            </tr>
        `).join("");
    }

    // Menambahkan transaksi baru
    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const date = dateInput.value;
        const category = categoryInput.value.trim();
        const description = descriptionInput.value.trim();
        const income = Number(incomeInput.value || 0);
        const expense = Number(expenseInput.value || 0);

        if (!date || !category || !description) {
            alert("Tanggal, kategori, dan keterangan wajib diisi.");
            return;
        }

        if (
            !Number.isFinite(income) ||
            !Number.isFinite(expense) ||
            income < 0 ||
            expense < 0 ||
            !Number.isInteger(income) ||
            !Number.isInteger(expense)
        ) {
            alert("Masukkan jumlah Rupiah berupa bilangan bulat positif.");
            return;
        }

        if (
            (income === 0 && expense === 0) ||
            (income > 0 && expense > 0)
        ) {
            alert(
                "Isi pemasukan atau pengeluaran saja. " +
                "Salah satunya harus lebih dari nol."
            );
            return;
        }

        const transaction = {
            id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            date: date,
            category: category,
            description: description,
            income: income,
            expense: expense,
            createdAt: Date.now()
        };

        transactions.push(transaction);
        saveTransactions();
        renderTransactions();

        // Kosongkan form setelah transaksi tersimpan
        form.reset();
        dateInput.value = todayString();
        categoryInput.focus();
    });

    // Menghapus transaksi
    transactionList.addEventListener("click", function(event) {
        const button = event.target.closest(".btn-delete");

        if (!button) return;

        const id = button.dataset.id;

        if (confirm("Yakin ingin menghapus transaksi ini?")) {
            transactions = transactions.filter(
                transaction => transaction.id !== id
            );

            saveTransactions();
            renderTransactions();
        }
    });

    // Tampilkan data saat halaman dibuka
    renderTransactions();
</script>
</body>
</html>
